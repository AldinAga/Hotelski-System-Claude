# Long-running CI helper for the hotel system on the NAS.
#
# Synology's Container Manager mails "stopped unexpectedly" for EVERY container
# that exits, so the test database never lives in a throwaway container.
#   hotel-postgres-test-claude    disposable test database for GitHub Actions: data on
#                                 tmpfs, fsync off, no published port.
name: claude-hotel-ci

services:
  hotel-postgres-test-claude:
    image: postgres:16-alpine
    container_name: hotel-postgres-test-claude
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    # The GitHub Actions runner (github-runner-claude) sits on claude-gh-runner_default
    # and reaches the database by this name; the project's own network stays.
    networks:
      - default
      - gh-runner

networks:
  gh-runner:
    name: claude-gh-runner_default
    external: true
